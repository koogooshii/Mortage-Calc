<div class="space-y-6">
    <!-- Tab Navigation -->
    <div class="flex flex-wrap gap-2 p-1 bg-gray-800/50 backdrop-blur-sm rounded-xl border border-gray-700">
        <button (click)="setTab('guide')"
            class="flex-1 px-4 py-3 text-sm font-semibold rounded-lg transition-all duration-200 flex items-center justify-center gap-2"
            [class.bg-cyan-600]="activeTab() === 'guide'" [class.text-white]="activeTab() === 'guide'"
            [class.text-gray-400]="activeTab() !== 'guide'" [class.hover:bg-gray-700]="activeTab() !== 'guide'">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-4.5 4.5 4.5 0 0 0-9 0 6.01 6.01 0 0 0 1.5 4.5m0 0a6.01 6.01 0 0 1 1.5 4.5m0 0v5.25m0 0a6.01 6.01 0 0 1-1.5 4.5 4.5 4.5 0 0 1-9 0 6.01 6.01 0 0 1-1.5-4.5m0 0h9" />
            </svg>
            Buyer's Guide
        </button>

        <button (click)="setTab('rules')"
            class="flex-1 px-4 py-3 text-sm font-semibold rounded-lg transition-all duration-200 flex items-center justify-center gap-2"
            [class.bg-red-600]="activeTab() === 'rules'" [class.text-white]="activeTab() === 'rules'"
            [class.text-gray-400]="activeTab() !== 'rules'" [class.hover:bg-gray-700]="activeTab() !== 'rules'">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
            </svg>
            Mortgage Rules
        </button>

        <button (click)="setTab('realtor')"
            class="flex-1 px-4 py-3 text-sm font-semibold rounded-lg transition-all duration-200 flex items-center justify-center gap-2"
            [class.bg-orange-600]="activeTab() === 'realtor'" [class.text-white]="activeTab() === 'realtor'"
            [class.text-gray-400]="activeTab() !== 'realtor'" [class.hover:bg-gray-700]="activeTab() !== 'realtor'">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M11.35 3.836c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" />
            </svg>
            Realtor Checklist
        </button>

        <button (click)="setTab('glossary')"
            class="flex-1 px-4 py-3 text-sm font-semibold rounded-lg transition-all duration-200 flex items-center justify-center gap-2"
            [class.bg-purple-600]="activeTab() === 'glossary'" [class.text-white]="activeTab() === 'glossary'"
            [class.text-gray-400]="activeTab() !== 'glossary'" [class.hover:bg-gray-700]="activeTab() !== 'glossary'">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.57 50.57 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
            </svg>
            Glossary
        </button>
    </div>

    <!-- Content Area -->
    <div class="transition-all duration-300">
        @switch (activeTab()) {
        @case ('guide') {
        <app-mortgage-guide />
        }
        @case ('rules') {
        <app-canadian-mortgage-rules />
        }
        @case ('realtor') {
        <app-realtor-info />
        }
        @case ('glossary') {
        <app-glossary />
        }
        }
    </div>
</div>
